name: Feature family ablation
on:
  push:
    branches: ['arena/214e9ea3-idea-3']
    paths:
      - '.github/workflows/feature-ablation.yml'
      - 'experiments/feature_ablation.json'
      - 'requirements-features.txt'
      - 'microtrade/feature_study.py'
      - 'scripts/run_feature_study.py'
      - 'scripts/publish_feature_check.py'
      - 'tests/test_feature_study.py'
  workflow_dispatch:
    inputs:
      run_feature_study:
        description: 'Run bounded noncommercial feature ablation study, public repo only'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: feature-ablation-predictive
  cancel-in-progress: false
jobs:
  search:
    if: ${{ github.event.repository.private == false && ((github.event_name == 'workflow_dispatch' && inputs.run_feature_study == true) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Authorize feature family ablation'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned optional research dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-features.txt
      - name: Validate features, selection and temporal separation on synthetic fixtures
        run: .venv/bin/python -m unittest discover -s tests -p test_feature_study.py -v
      - name: Obtain metadata for original pinned primary artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh api repos/joaquinignaciomondaca-code/Idea_3/actions/artifacts/12117929369 > data/feature_artifact_metadata.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: joaquinignaciomondaca-code/Idea_3
          run-id: 39079361222
          name: primary-BTCUSDT-39079361222-1
          path: data/feature_primary_input
      - name: Reaudit and run the 390-fit prescribed ablation study twice
        run: .venv/bin/python -m scripts.run_feature_study --package data/feature_primary_input --metadata data/feature_artifact_metadata.json
      - name: Publish all aggregate importances, selections and external scores
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python -m scripts.publish_feature_check
      - name: Preserve complete noncommercial research records
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feature-ablation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/feature_study_run/
            data/feature_artifact_metadata.json
            data/feature_primary_input/data/primary_import/BINANCE_TERMS.md
            data/feature_primary_input/data/primary_import/ATTRIBUTION.txt
          if-no-files-found: warn
          retention-days: 7
