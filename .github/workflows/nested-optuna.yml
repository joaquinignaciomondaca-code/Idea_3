name: Nested Optuna predictive search
on:
  push:
    branches: ['arena/214e9ea3-idea-3']
    paths:
      - '.github/workflows/nested-optuna.yml'
      - 'experiments/nested_optuna_predictive.json'
      - 'requirements-optuna.txt'
      - 'microtrade/nested_*.py'
      - 'scripts/run_nested_optuna.py'
      - 'scripts/publish_nested_check.py'
      - 'tests/test_nested_search.py'
  workflow_dispatch:
    inputs:
      run_nested_search:
        description: 'Run bounded noncommercial nested predictive study, public repo only'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: nested-optuna-predictive
  cancel-in-progress: false
jobs:
  search:
    if: ${{ github.event.repository.private == false && ((github.event_name == 'workflow_dispatch' && inputs.run_nested_search == true) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Authorize nested Optuna predictive search'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned optional research dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-optuna.txt
      - name: Validate nested selection and temporal audit on synthetic fixtures
        run: .venv/bin/python -m unittest discover -s tests -p test_nested_search.py -v
      - name: Obtain metadata for original pinned primary artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh api repos/joaquinignaciomondaca-code/Idea_3/actions/artifacts/12117929369 > data/nested_artifact_metadata.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: joaquinignaciomondaca-code/Idea_3
          run-id: 39079361222
          name: primary-BTCUSDT-39079361222-1
          path: data/nested_primary_input
      - name: Reaudit and run the 30-trial nested study twice
        run: .venv/bin/python -m scripts.run_nested_optuna --package data/nested_primary_input --metadata data/nested_artifact_metadata.json
      - name: Publish all aggregate trials, selections and external scores
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python -m scripts.publish_nested_check
      - name: Preserve complete noncommercial research records
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nested-optuna-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/nested_optuna_run/
            data/nested_artifact_metadata.json
            data/nested_primary_input/data/primary_import/BINANCE_TERMS.md
            data/nested_primary_input/data/primary_import/ATTRIBUTION.txt
          if-no-files-found: warn
          retention-days: 7
