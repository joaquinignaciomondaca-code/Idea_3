name: Converged classifier
on:
  push:
    branches: ['arena/214e9ea3-idea-3']
    paths:
      - '.github/workflows/converged-classifier.yml'
      - 'experiments/converged_classifier.json'
      - 'requirements-audit.txt'
      - 'microtrade/converged_classifier.py'
      - 'scripts/run_converged_classifier.py'
      - 'scripts/publish_converged_check.py'
      - 'tests/test_converged_classifier.py'
  workflow_dispatch:
    inputs:
      run_converged_classifier:
        description: 'Run bounded noncommercial convergence-controlled classifier study, public repo only'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: converged-classifier
  cancel-in-progress: false
jobs:
  search:
    if: ${{ github.event.repository.private == false && ((github.event_name == 'workflow_dispatch' && inputs.run_converged_classifier == true) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Authorize convergence controlled classifier'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned optional research dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-audit.txt
      - name: Validate matched SGD, convergence and inner selection on synthetic fixtures
        run: .venv/bin/python -m unittest discover -s tests -p test_converged_classifier.py -v
      - name: Obtain metadata for original pinned primary artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh api repos/joaquinignaciomondaca-code/Idea_3/actions/artifacts/12117929369 > data/converged_artifact_metadata.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: joaquinignaciomondaca-code/Idea_3
          run-id: 39079361222
          name: primary-BTCUSDT-39079361222-1
          path: data/converged_primary_input
      - name: Reaudit and run the 54-fit controlled classifier study twice
        run: .venv/bin/python -m scripts.run_converged_classifier --package data/converged_primary_input --metadata data/converged_artifact_metadata.json
      - name: Publish all aggregate candidates, convergence and external scores
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python -m scripts.publish_converged_check
      - name: Preserve complete noncommercial research records
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: converged-classifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/converged_classifier_run/
            data/converged_artifact_metadata.json
            data/converged_primary_input/data/primary_import/BINANCE_TERMS.md
            data/converged_primary_input/data/primary_import/ATTRIBUTION.txt
          if-no-files-found: warn
          retention-days: 7
